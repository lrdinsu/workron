# kind cluster definition. The single control-plane node maps host port
# 30080 to its NodePort 30080 so the scheduler Service (type: NodePort,
# nodePort: 30080) is reachable at http://localhost:30080 from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: workron
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
