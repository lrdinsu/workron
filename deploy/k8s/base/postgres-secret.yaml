# Postgres credentials. The base ships placeholder values that overlays
# replace via patches or generators. Holds:
#   - username/password/database for the Postgres container's own env vars
#   - database-url: a full DSN the scheduler reads via secretKeyRef
# Splitting credentials and DSN avoids reconstructing the URL inside the pod.
apiVersion: v1
kind: Secret
metadata:
  name: workron-postgres
type: Opaque
stringData:
  username: workron
  password: changeme
  database: workron
  database-url: postgres://workron:changeme@workron-postgres:5432/workron?sslmode=disable
