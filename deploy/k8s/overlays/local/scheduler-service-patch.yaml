# Promote the in-cluster scheduler Service to NodePort so the kind node's
# host-port mapping (host 30080 -> nodePort 30080) reaches the API at
# localhost:30080 from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: workron-scheduler
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
