# Strategic-merge patch that replaces the base placeholder credentials with
# a development-only value. The kind cluster only listens on localhost, so
# a hardcoded dev password is intentional and not a secret in any meaningful
# sense. For real deployments, replace this Secret via External Secrets Operator,
# sealed-secrets, or your platform's secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: workron-postgres
type: Opaque
stringData:
  username: workron
  password: workron_dev_password
  database: workron
  database-url: postgres://workron:workron_dev_password@workron-postgres:5432/workron?sslmode=disable
